<main class="login-gradient relative min-h-screen px-5 py-4 text-[#3E0911]">
  <a routerLink="/" class="absolute top-5 left-5 z-10 inline-flex h-8 items-center gap-1.5 rounded-lg border border-[#85383E]/15 bg-[#fffdf9]/75 px-2.5 text-[9px] font-bold text-[#85383E] shadow-[0_4px_14px_rgba(62,9,17,0.06)] backdrop-blur-sm transition hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#85383E]">
    <svg viewBox="0 0 24 24" class="size-3" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M19 12H5M11 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Voltar ao catálogo
  </a>
  <section class="mx-auto flex min-h-[calc(100vh-2rem)] w-full max-w-[350px] flex-col">
    <header class="flex justify-center pt-[60px]">
      <a routerLink="/" class="flex items-center" aria-label="SemeiAki, início">
        <img src="/semeiaki-logo.png" alt="SemeiAki — Produtos da Nossa Terra" class="h-auto w-[128px]" />
      </a>
    </header>

    <div class="flex flex-1 items-start pt-[76px] pb-6">
      <div class="w-full">
        <div class="mb-6">
          <span class="mb-3 inline-flex rounded-full bg-[#85383E] px-2.5 py-1 text-[8px] font-bold tracking-[0.13em] text-[#D7CAB7] uppercase shadow-[0_5px_14px_rgba(62,9,17,0.12)]">
            Área do produtor e comprador
          </span>
          <h1 class="max-w-[360px] text-[clamp(2rem,4vw,2.5rem)] leading-[1.02] font-bold tracking-[-0.055em]">
            Entre e cultive novas conexões.
          </h1>
          <p class="mt-3 max-w-[360px] text-sm leading-[1.65] font-medium text-[#383C23]">
            Acesse sua conta para divulgar sua produção ou encontrar alimentos frescos perto de você.
          </p>
        </div>

        <form (submit)="submitLogin($event)" class="space-y-5">
          <div>
            <label for="login-email" class="mb-2 block text-sm font-semibold">E-mail</label>
            <div class="relative">
              <svg viewBox="0 0 24 24" class="pointer-events-none absolute top-1/2 left-2.5 size-3.5 -translate-y-1/2 text-[#71774B]" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="3" /><path d="m5 8 7 5 7-5" />
              </svg>
              <input id="login-email" name="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com" class="h-14 w-full rounded-xl border border-[#71774B]/55 bg-[#fffdf9]/85 py-2 pl-10 pr-3 text-base font-medium outline-none transition placeholder:text-[#71774B] focus:border-[#85383E] focus:bg-white focus:ring-4 focus:ring-[#85383E]/10" />
            </div>
          </div>

          <div>
            <label for="login-password" class="mb-2 block text-sm font-semibold">Senha</label>
            <div class="relative">
              <svg viewBox="0 0 24 24" class="pointer-events-none absolute top-1/2 left-2.5 size-3.5 -translate-y-1/2 text-[#71774B]" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="3" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input id="login-password" name="password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" required minlength="8" placeholder="Digite sua senha" class="h-14 w-full rounded-xl border border-[#71774B]/55 bg-[#fffdf9]/85 py-2 pl-10 pr-12 text-base font-medium outline-none transition placeholder:text-[#71774B] focus:border-[#85383E] focus:bg-white focus:ring-4 focus:ring-[#85383E]/10" />
              <button type="button" (click)="showPassword = !showPassword" class="absolute top-1/2 right-2 -translate-y-1/2 rounded-lg p-2 text-[#71774B] transition hover:bg-[#D7CAB7] hover:text-[#383C23] focus-visible:outline-2 focus-visible:outline-[#85383E]" [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
                @if (showPassword) {
                  <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z" /><circle cx="12" cy="12" r="2.5" />
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="m3 3 18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 4.4A11.7 11.7 0 0 1 12 4c5.5 0 9 6 9 6a16 16 0 0 1-2.1 2.9M6.2 6.2C4.1 7.6 3 10 3 10s3.5 6 9 6c1.2 0 2.3-.3 3.3-.7" stroke-linecap="round" />
                  </svg>
                }
              </button>
            </div>
            <div class="mt-2 flex justify-end">
              <button type="button" (click)="message = 'A recuperação de senha ainda não está disponível.'" class="min-h-10 text-sm font-bold text-[#85383E] transition hover:text-[#3E0911] focus-visible:outline-2 focus-visible:outline-[#85383E]">
                Esqueci minha senha
              </button>
            </div>
          </div>

          <label class="flex min-h-11 w-fit cursor-pointer items-center gap-3 text-sm font-semibold text-[#383C23]">
            <input type="checkbox" name="remember" class="size-5 rounded-sm border-[#71774B] accent-[#85383E]" />
            Lembrar de mim
          </label>

          <button type="submit" [disabled]="submitting" class="flex min-h-14 w-full items-center justify-center gap-2 rounded-xl bg-[#85383E] px-4 py-3 text-base font-extrabold text-[#D7CAB7] shadow-[0_8px_20px_rgba(62,9,17,0.15)] transition hover:-translate-y-0.5 hover:bg-[#3E0911] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#85383E] disabled:opacity-70">
            {{ submitting ? 'Entrando...' : 'Entrar na minha conta' }}
            <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 12h14M14 7l5 5-5 5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <p aria-live="polite" class="min-h-6 text-center text-sm font-semibold text-[#85383E]">{{ message }}</p>
        </form>

        <p class="mt-4 text-center text-sm font-medium text-[#383C23]">
          Ainda não tem uma conta?
          <a routerLink="/cadastro" class="font-bold underline decoration-[#85383E] decoration-2 underline-offset-4 transition hover:text-[#85383E]">Criar conta</a>
        </p>
      </div>
    </div>

    <footer class="flex items-center justify-between gap-4 text-[8px] font-semibold text-[#383C23]/80">
      <span>© 2026 SemeiAki</span>
      <span>Do campo para a sua região</span>
    </footer>
  </section>
</main>
